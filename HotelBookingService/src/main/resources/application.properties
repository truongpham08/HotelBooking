spring.application.name=HotelBookingService

server.port=8080
server.servlet.context-path=/hotel-booking

# Microsoft SQL Server
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:hotel_booking};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.web.resources.add-mappings=false

openapi.service.title=Hotel Booking API
openapi.service.version=1.0.0
openapi.service.url=${APP_BASE_URL:http://localhost:8080/hotel-booking}

#springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
# springdoc.swagger-ui.enabled=false

logging.level.org.springframework.core.env=DEBUG

