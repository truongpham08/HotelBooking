spring.application.name=HotelBookingService

server.port=8080
server.servlet.context-path=/hotel-booking

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hotel_booking;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.web.resources.add-mappings=false

openapi.service.title=Hotel Booking API
openapi.service.version=1.0.0
openapi.service.url=${APP_BASE_URL:http://localhost:8080/hotel-booking}

#springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
# springdoc.swagger-ui.enabled=false

logging.level.org.springframework.core.env=DEBUG

